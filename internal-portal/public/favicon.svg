<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Top Arch (starts from left, arches over, ends with dot at top-right) -->
  <path
    d="M 52 112 C 60 52, 120 44, 164 68"
    stroke="#0f2942"
    strokeWidth="4.5"
    strokeLinecap="round"
  />
  <circle cx="164" cy="68" r="4.5" fill="#0f2942" />

  <!-- Inner Top Arch (sweeping close to the shield) -->
  <path
    d="M 64 106 C 70 64, 115 56, 168 88"
    stroke="#0f2942"
    strokeWidth="3"
    strokeLinecap="round"
  />

  <!-- Left Bottom Arch (starts at dot at 9 o'clock, curves down-right) -->
  <path
    d="M 38 98 C 42 76, 68 58, 108 52"
    stroke="#0f2942"
    strokeWidth="3.5"
    strokeLinecap="round"
  />
  <circle cx="38" cy="98" r="4" fill="#0f2942" />

  <!-- Right Bottom Dot at 5 o'clock and its tiny arch -->
  <circle cx="168" cy="110" r="4" fill="#0f2942" />
  <path
    d="M 168 110 C 160 102, 140 92, 118 90"
    stroke="#0f2942"
    strokeWidth="2.5"
    strokeLinecap="round"
  />

  <!-- Outer Navy Shield Body -->
  <path
    d="M 56 80 Q 100 68 144 80 Q 146 115 100 142 Q 54 115 56 80 Z"
    fill="#0f2942"
    stroke="#0f2942"
    strokeWidth="1"
  />

  <!-- White Highlight Gap Layer -->
  <path
    d="M 59 82 Q 100 71 141 82 Q 143 113 100 138 Q 57 113 59 82 Z"
    stroke="white"
    strokeWidth="1.5"
    fill="none"
  />

  <!-- Inner Dark Grey/Black Shield Content -->
  <path
    d="M 62 84 Q 100 74 138 84 Q 140 111 100 134 Q 60 111 62 84 Z"
    fill="#1c1c1c"
  />

  <!-- Bezel Ring (camera outer bezel) -->
  <circle cx="100" cy="106" r="22" fill="#2c2c2c" stroke="#444" strokeWidth="1" />

  <!-- Rivet Screws on Bezel (3 small dots) -->
  <circle cx="86" cy="94" r="1.5" fill="white" opacity="0.9" />
  <circle cx="114" cy="94" r="1.5" fill="white" opacity="0.9" />
  <circle cx="100" cy="125" r="1.5" fill="white" opacity="0.9" />

  <!-- Camera Lens Outer Bezel -->
  <circle cx="100" cy="106" r="16" fill="#0c1722" stroke="#38BDF8" strokeWidth="1.5" />
  <circle cx="100" cy="106" r="12" fill="#111" />

  <!-- Camera Lens Glass with radial gradient -->
  <circle cx="100" cy="106" r="8" fill="url(#lensBlueGradient)" />
  
  <!-- Lens flare horizontal line -->
  <ellipse cx="100" cy="106" rx="7" ry="1.2" fill="#e0f7fa" opacity="0.75" />

  <!-- Inner Iris aperture -->
  <circle cx="100" cy="106" r="4.5" fill="#01182c" />
  <circle cx="100" cy="106" r="2" fill="#00e5ff" />

  <!-- Lens reflection white dot -->
  <circle cx="98.5" cy="104.5" r="1.2" fill="white" />

  <defs>
    <radialGradient id="lensBlueGradient" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#00b0ff" />
      <stop offset="60%" stopColor="#0072c6" />
      <stop offset="100%" stopColor="#002d5a" />
    </radialGradient>
  </defs>
</svg>